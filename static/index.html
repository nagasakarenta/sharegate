<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ShareGate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Theme before first paint: stored choice, else the system preference.
  (function () { try { var t = localStorage.getItem("sg-theme"); if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = "dark"; } })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4Z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></div>
      <div><div class="brand-name">ShareGate</div><div class="brand-sub" data-i18n="logo.sub"></div></div>
    </div>

    <nav class="nav" aria-label="Pages">
      <button data-tab="inbox" class="active"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span data-i18n="nav.inbox"></span><span class="count" id="count-inbox"></span><kbd>1</kbd></button>
      <button data-tab="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav.feed"></span><span class="count" id="count-feed"></span><kbd>2</kbd></button>
      <button data-tab="map"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="m8 7 8 1M7.5 8 9.5 16M16.5 10l-5 6.5"/></svg><span data-i18n="nav.map"></span><kbd>3</kbd></button>
      <button data-tab="ask"><svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 1 7 7c0 2.6-1.4 4.9-3.5 6.1V19a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-2.9A7 7 0 0 1 12 3Z"/><path d="M9.5 22h5"/></svg><span data-i18n="nav.ask"></span><kbd>4</kbd></button>
      <button data-tab="voice"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 1 1-6 0V6a3 3 0 0 1 3-3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg><span data-i18n="nav.voice"></span><kbd>5</kbd></button>
      <button data-tab="usage"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-i18n="nav.usage"></span><kbd>6</kbd></button>
    </nav>

    <div class="sidebar-foot">
      <div class="me-row"><div class="avatar" id="me-avatar">?</div><select id="me" aria-label="Signed in as"></select></div>
      <div class="engine" id="engine"><span class="dot"></span><span id="engine-text">…</span></div>
      <div class="icon-row">
        <button class="icon-btn" id="help" data-i18n-title="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></button>
        <button class="icon-btn" id="lang-toggle" data-i18n-title="lang.toggle"><span data-i18n="lang.short"></span></button>
        <button class="icon-btn" id="theme-toggle" data-i18n-title="theme.toggle"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
        <button class="icon-btn" id="kbd-btn" data-i18n-title="kbd.title"><kbd>?</kbd></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="crumb">ShareGate /</span><h1 id="topbar-title"></h1>
      <button class="cmd-btn" id="cmd-btn"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span data-i18n="cmdk.placeholder"></span><kbd>⌘</kbd><kbd>K</kbd></button>
    </div>

    <div class="content">
      <section id="tab-inbox" class="tab active">
        <header class="page-head">
          <div><h1 data-i18n="inbox.title"></h1><p data-i18n="inbox.sub"></p></div>
          <div class="head-actions">
            <label class="btn btn-ghost"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg><span data-i18n="btn.import"></span><input type="file" id="import-file" hidden></label>
            <button class="btn btn-ghost" id="load-demo" data-i18n="btn.demo"></button>
            <button class="btn btn-primary" id="gate-all"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.6 8 10 4.6-1.4 8-5 8-10V6l-8-4Z"/></svg><span id="gate-all-label" data-i18n="btn.gate"></span></button>
          </div>
        </header>
        <div class="checklist panel" id="checklist" hidden></div>
        <div class="stats" id="inbox-stats"></div>
        <div class="split">
          <div class="list-wrap">
            <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="inbox-search" data-i18n-ph="search.chats"><kbd>/</kbd></div>
            <ul id="inbox-list" class="list" aria-label="Chats"></ul>
          </div>
          <div id="inbox-detail" class="panel detail"></div>
        </div>
      </section>

      <section id="tab-feed" class="tab">
        <header class="page-head">
          <div><h1 data-i18n="feed.title"></h1><p data-i18n="feed.sub"></p></div>
          <div class="head-actions" id="feed-filters"></div>
        </header>
        <div class="split">
          <div class="list-wrap"><ul id="feed-list" class="list" aria-label="Shared"></ul></div>
          <div id="feed-detail" class="panel detail"></div>
        </div>
      </section>

      <section id="tab-map" class="tab">
        <header class="page-head">
          <div><h1 data-i18n="map.title"></h1><p data-i18n="map.sub"></p></div>
          <div class="legend" id="map-legend"></div>
        </header>
        <div id="graph" class="panel"></div>
      </section>

      <section id="tab-ask" class="tab">
        <header class="page-head">
          <div><h1 data-i18n="ask.title"></h1><p data-i18n="ask.sub"></p></div>
        </header>
        <div class="chat panel">
          <div class="chat-top"><span class="muted" data-i18n="ask.talking"></span><div class="avatar" id="ask-avatar">?</div><select id="ask-person"></select><span class="pill pill-ai" id="ask-engine"></span></div>
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <div class="suggest" id="suggest"></div>
          <form id="ask-form" class="composer">
            <textarea id="ask-q" rows="1" data-i18n-ph="ask.ph"></textarea>
            <button class="btn btn-primary btn-icon" type="submit" data-i18n-title="send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
        </div>
      </section>

      <section id="tab-voice" class="tab">
        <header class="page-head">
          <div><h1 data-i18n="voice.title"></h1><p data-i18n="voice.sub"></p></div>
          <div class="head-actions"><button class="btn btn-ghost" id="voice-rebuild" data-i18n="btn.relearn"></button></div>
        </header>
        <div id="voice-out"></div>
      </section>

      <section id="tab-usage" class="tab">
        <header class="page-head">
          <div><h1 data-i18n="usage.title"></h1><p data-i18n="usage.sub"></p></div>
        </header>
        <div class="tiers" id="tiers"></div>
      </section>
    </div>
  </main>
</div>

<!-- command palette -->
<div class="overlay" id="cmdk" hidden role="dialog" aria-modal="true">
  <div class="cmdk">
    <div class="cmdk-input"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="cmdk-input" data-i18n-ph="cmdk.placeholder" autocomplete="off" spellcheck="false"><kbd>esc</kbd></div>
    <div class="cmdk-list" id="cmdk-list"></div>
    <div class="cmdk-foot"><span><kbd>↑</kbd><kbd>↓</kbd><em data-i18n="cmdk.navigate"></em></span><span><kbd>↵</kbd><em data-i18n="cmdk.select"></em></span></div>
  </div>
</div>

<!-- keyboard shortcuts -->
<div class="overlay" id="kbd" hidden role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head"><h2 data-i18n="kbd.title"></h2><button class="btn btn-sm btn-ghost" id="kbd-close"><kbd>esc</kbd></button></div>
    <div class="kb-grid" id="kb-grid"></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
